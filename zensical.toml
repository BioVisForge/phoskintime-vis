# Documentation site. Sources: website/ ; build: npm run docs:build (it generates the reference,
# release and screenshot files first, then runs zensical) ; output: site/
[project]
site_name = "PhosKinTime-Vis"
site_description = "Offline viewer and run comparison for PhosKinTime run bundles."
site_author = "Abhinav Mishra"
site_url = "https://biovisforge.github.io/phoskintime-vis/"
repo_url = "https://github.com/BioVisForge/phoskintime-vis"
repo_name = "BioVisForge/phoskintime-vis"
edit_uri = "edit/main/website/"
copyright = "BSD-3-Clause · BioVisForge · All example data is synthetic."
docs_dir = "website"
site_dir = "site"
use_directory_urls = true
extra_css = ["stylesheets/brand.css"]
nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    "guide/index.md",
    { "Getting started" = "guide/getting-started.md" },
    { "Open a run bundle" = "guide/open-a-bundle.md" },
    { "Explore a run" = "guide/explore.md" },
    { "Panels" = "guide/panels.md" },
    { "Compare two runs" = "guide/compare.md" },
    { "Export figures" = "guide/export.md" },
    { "What-if preview" = "guide/what-if.md" },
    { "Troubleshooting" = "guide/troubleshooting.md" },
    { "Glossary" = "guide/glossary.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Bundle schema" = "reference/bundle-schema.md" },
    { "Engine API (draft)" = "reference/engine-api.md" },
    { "TypeScript API" = "reference/api/index.md" },
  ] },
  { "Releases" = [
    "releases/index.md",
    { "Changelog" = "releases/changelog.md" },
  ] },
  { "Development" = [
    "development/index.md",
    { "Contributing" = "development/contributing.md" },
    { "Security" = "development/security.md" },
    { "Cite" = "development/citation.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/brand/logo.svg"
favicon = "assets/brand/favicon.svg"
features = [
  "content.code.copy",
  "content.action.edit",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/BioVisForge"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
