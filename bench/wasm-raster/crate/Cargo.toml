[package]
name = "pkv-kernels"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false
description = "CPU rasteriser for PhosKinTime-Vis data layers (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "no-std-float"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
