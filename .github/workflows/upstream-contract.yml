# Optional, non-blocking: catches drift with PhosKinTime early.
name: upstream-contract
on:
  workflow_dispatch:
    inputs:
      ref: { description: 'phoskintime ref', default: 'global' }
  schedule:
    - cron: '17 5 * * 1' # weekly, Monday
permissions:
  contents: read
jobs:
  upstream-contract:
    name: Upstream bundle contract (bibymaths/phoskintime)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: bibymaths/phoskintime, ref: '${{ inputs.ref || ''global'' }}', path: upstream, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Sync contracts (fails on a breaking change without an adapter)
        run: npm run sync-contracts -- upstream HEAD
      - name: Does the bundle command exist?
        id: probe
        run: |
          if grep -rqs "def bundle\|\"bundle\"" upstream/config/cli.py; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; echo "::notice::upstream bundle command not available"; fi
      - name: Generate bundles from upstream synthetic fixtures
        if: steps.probe.outputs.available == 'true'
        working-directory: upstream
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          ~/.pixi/bin/pixi run phoskintime bundle create --synthetic-fixtures --out ../tests/fixtures/upstream
      - name: Unit + e2e against upstream bundles
        if: steps.probe.outputs.available == 'true'
        run: |
          npx playwright install --with-deps chromium firefox
          npm test && npm run build:single && UPSTREAM_FIXTURES=1 npm run test:e2e
