# Publish the documentation site, the live demo (demo/) and the screenshot gallery (gallery/) to
# GitHub Pages. Manual only: do not trigger without the owner's OK.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    name: Build documentation, demo and gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r tests/requirements-dev.txt -r website/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium
      - run: python tests/fixtures/make_fixtures.py
      - run: npm run build:single && npm run docs:assets
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/configure-pages@v5
      - id: d
        uses: actions/deploy-pages@v4
