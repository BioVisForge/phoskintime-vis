# Deploys the synthetic demo to GitHub Pages. Manual only: do not trigger without the owner's OK.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    name: Build and deploy synthetic demo
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r tests/requirements-dev.txt && python tests/fixtures/make_fixtures.py
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Docs assets (screenshots, gallery; not kept in git)
        run: npm run build:single && npm run docs:assets
      - run: npm run build && node scripts/copy-demo.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
