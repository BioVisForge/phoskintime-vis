# Python-side tasks in isolated environments. The viewer itself is TypeScript: see package.json.
#   tox              lint, fixtures and parity
#   tox -e docs      documentation site
#   tox -e release -- 0.2.0
[tox]
env_list = lint, fixtures, parity
skipsdist = true
requires = tox>=4

[testenv]
skip_install = true
deps = -r tests/requirements-dev.txt
passenv =
    HOME
    PLAYWRIGHT_BROWSERS_PATH

[testenv:lint]
description = ruff on the Python tooling
deps = ruff==0.17.6
commands = ruff check .

[testenv:fixtures]
description = build the synthetic spec-fixture bundles
commands = python tests/fixtures/make_fixtures.py

[testenv:parity]
description = compare the TypeScript transforms with numpy/scipy reference formulas
setenv = PYTHON = {envpython}
allowlist_externals = npm
commands = npm run test:parity

[testenv:docs]
description = build the documentation site (needs npm ci and a Playwright Chromium)
deps =
    -r tests/requirements-dev.txt
    -r website/requirements.txt
setenv = ZENSICAL = {envbindir}/zensical
allowlist_externals = npm
commands =
    python tests/fixtures/make_fixtures.py
    npm run build:single
    npm run docs:assets
    npm run docs:build

[testenv:release]
description = prepare a release: tox -e release -- X.Y.Z (needs git-cliff)
deps =
    bump-my-version==1.8.4
allowlist_externals =
    node
commands = node scripts/release.mjs {posargs}
