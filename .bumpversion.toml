# One version, every place it is written. Used by `npm run release -- X.Y.Z` (scripts/release.mjs),
# which also updates the changelog and release notes. Nothing is committed or tagged here.
[tool.bumpversion]
current_version = "0.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:-(?P<pre>[0-9A-Za-z.-]+))?"
serialize = ["{major}.{minor}.{patch}-{pre}", "{major}.{minor}.{patch}"]
commit = false
tag = false
tag_name = "v{new_version}"
allow_dirty = true

[[tool.bumpversion.files]]
filename = "package.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

# only the two entries for this package, never a dependency that happens to share the number
[[tool.bumpversion.files]]
filename = "package-lock.json"
regex = true
search = "(\"name\": \"phoskintime-vis\",\\s*\"version\": )\"{current_version}\""
replace = "\\g<1>\"{new_version}\""

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "\nversion: \"{current_version}\""
replace = "\nversion: \"{new_version}\""

[[tool.bumpversion.files]]
filename = ".zenodo.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = "website/development/citation.md"
search = "version = {{{current_version}}}"
replace = "version = {{{new_version}}}"
